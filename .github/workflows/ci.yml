name: ci

# Runs on every push and PR. The race detector is the point: it needs cgo, which
# is unavailable on the maintainer's Windows machine, so concurrency bugs in the
# stats/rebuild goroutines could previously only be found by reading the code.
# Here they get caught automatically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The Go build embeds frontend/dist, which is not committed. A minimal
      # placeholder keeps `go build` honest without paying for a full npm install
      # on every push; the release workflow builds the real frontend.
      - name: Placeholder frontend assets
        run: |
          mkdir -p frontend/dist
          [ -f frontend/dist/index.html ] || echo '<!doctype html><title>ci</title>' > frontend/dist/index.html

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        # Retain the full SQLite-backed lifecycle suite and the 81-pair protocol
        # matrix under race instrumentation; neither is replaced by core checks.
        run: go test -race -timeout=30m ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both scripts are piped into `bash` as root — install.sh on the panel
      # host, install-singbox.sh on every landing node. A syntax error in either
      # is a broken machine, so at minimum they must parse.
      - name: Parse install scripts
        run: |
          bash -n internal/assets/install-singbox.sh
          bash -n install.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        # Keep the same type and network checks required before a release.
        run: npm ci
      - name: Test frontend (unit + accessibility)
        working-directory: frontend
        run: npm test
      - name: Production frontend build (typecheck + bundle)
        working-directory: frontend
        run: npm run build

  relay-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
      - name: Verify official Vision framing fix
        run: bash scripts/test-vision-framing.sh
      - name: Verify exact transport buffer backport and negative controls
        env:
          QZ_TRANSPORT_STRESS_ROUNDS: "100"
        run: bash scripts/test-transport-buffer.sh --check-baseline
      - name: Build the exact release core candidate (amd64 and arm64)
        id: core
        run: bash scripts/build-singbox.sh --output-dir "$RUNNER_TEMP/qz-core" --arch amd64,arm64
      - name: Record candidate core provenance
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-candidate-provenance
          path: ${{ runner.temp }}/qz-core/sing-box-provenance.json
          if-no-files-found: error
      - name: Per-user metering scale diagnostics (isolated 100 and 1000 users)
        env:
          QZ_SINGBOX_TEST_BIN: ${{ runner.temp }}/qz-core/sing-box-linux-amd64
          QZ_SINGBOX_REQUIRE_STATS: "1"
          QZ_METERING_SCALE: "1"
        run: go test ./internal/store -run '^TestMeteringRelayUserScale$' -count=1 -v

      # A scale-fixture failure must not hide independent traffic failures.
      # The job still fails, and an unbuilt/unverified core is never executed.
      - name: Shared and per-user relay observation over loopback
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        env:
          QZ_SINGBOX_TEST_BIN: ${{ runner.temp }}/qz-core/sing-box-linux-amd64
          QZ_SINGBOX_REQUIRE_STATS: "1"
          QZ_VISION_STRESS_BATCHES: "100"
        run: go test -race ./internal/store -run '^(TestMeteringRelayRealSingbox|TestRelayVLESSFlowMatchesListener)' -count=1 -v
