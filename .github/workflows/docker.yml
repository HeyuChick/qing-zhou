name: docker

# 构建并推送多架构镜像到 GHCR。
# 与 release.yml 同样在「发布 release」时触发（也可手动指定 tag 重建）。
# 发布后镜像为 ghcr.io/<owner>/qing-zhou:<tag> 与 :latest（仅 release 事件打 latest）。
#
# 首次推送后，到仓库 Packages 把该镜像设为 Public，匿名 docker pull 才可用。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the image for (e.g. v0.2.7)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch can rebuild an older tag. Fetch the tag and build
          # that exact revision instead of silently packaging the current main.
          fetch-depth: 0

      - name: Resolve tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          REVISION="$(git rev-parse "${TAG}^{commit}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          git checkout --detach "$REVISION"

      # ghcr 镜像名必须小写
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          # latest 只随正式 release 移动；手动重建历史 tag 只覆盖该版本标签。
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.ver.outputs.revision }}
            org.opencontainers.image.version=${{ steps.ver.outputs.tag }}
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Attach supply-chain metadata to the multi-platform image. Consumers
          # can inspect both without trusting a separate file from the release.
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
