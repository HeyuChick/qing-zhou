name: build-custom-release

# 自用版发布流水线：跟踪上游 release → 合并进 heiyu-custom → 构建发布。
# 面板端设置 QZ_UPDATE_REPO=HeyuChick/qing-zhou 即可从本仓库在线更新。
#
# 版本方案: 上游 vX.Y.Z → 本仓库 vX.Y.Z.N（第4位自增）。
# 这样既严格大于上游同版本（面板会提示更新），又严格小于上游下一个版本
# （上游发 v0.2.53 后仍会被识别为更新，不会卡住）。
#
# 跳过逻辑: 合并结果 SHA 与上一个同基底 release 记录的一致 → 无变化不构建。
# 冲突时任务失败（红色），需要手动在 heiyu-custom 分支解决后重跑。

on:
  schedule:
    - cron: "17 */6 * * *" # 每6小时检查上游
  workflow_dispatch:
    inputs:
      force:
        description: "强制构建（忽略无变化跳过）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-custom-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heiyu-custom
          fetch-depth: 0

      - name: Merge upstream latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "heiyu-ci"
          git config user.email "actions@users.noreply.github.com"
          UP_TAG=$(gh api repos/mllt992/qing-zhou/releases/latest --jq .tag_name)
          echo "UP_TAG=$UP_TAG" >> "$GITHUB_ENV"
          echo "上游最新 release: $UP_TAG"
          git remote add upstream https://github.com/mllt992/qing-zhou.git
          git fetch upstream "refs/tags/$UP_TAG:refs/tags/$UP_TAG" --no-tags
          BEFORE=$(git rev-parse HEAD)
          # fork 已删除、上游仍在改的文件（独立登录页架构替代 LoginDialog）只会
          # 产生 modify/delete 冲突；冲突集全部命中时按 fork 的删除自动解决，
          # .github/workflows/* 的冲突在下面统一钉回合并前状态；
          # 出现其他冲突仍然失败（任务红色），需手动解决。
          KNOWN_DELETED="frontend/src/components/LoginDialog.vue"
          if git merge-base --is-ancestor "$UP_TAG" HEAD; then
            echo "已包含 $UP_TAG，无需合并"
          else
            # 使用 --no-commit --no-ff，让 .github/workflows 钉回与 KNOWN_DELETED 解冲突
            # 都落在同一个 merge commit 里：既避免上游改动 .github/workflows/* 触发冲突
            # 阻塞合并（如 v0.2.99 的 ci.yml），也确保不会产生触碰 .github/workflows 的
            # 中间提交（GITHUB_TOKEN 无 workflows 权限）。
            MERGE_OK=1
            git merge --no-commit --no-ff "$UP_TAG" || MERGE_OK=0
            if [ "$MERGE_OK" = 0 ] && [ ! -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then
              echo "::error::git merge $UP_TAG 失败（未进入合并状态）"
              exit 1
            fi
            if [ "$MERGE_OK" = 0 ]; then
              UNMERGED=$(git diff --name-only --diff-filter=U)
              AUTO=1
              REAL_CONFLICTS=""
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  .github/workflows/*)
                    # .github/workflows 目录整体钉回 $BEFORE，下面统一恢复
                    ;;
                  *)
                    case " $KNOWN_DELETED " in
                      *" $f "*) git rm -q -f "$f" ;;
                      *) AUTO=0; REAL_CONFLICTS="${REAL_CONFLICTS}${REAL_CONFLICTS:+ }$f" ;;
                    esac
                    ;;
                esac
              done <<< "$UNMERGED"
              if [ "$AUTO" != 1 ]; then
                echo "::error::存在无法自动解决的冲突：$REAL_CONFLICTS"
                exit 1
              fi
            fi
            # 本仓库 workflow 目录不跟随上游：GITHUB_TOKEN 无 workflows 权限，推不动
            # workflow 文件，且 fork 使用自有发布流水线。rm -f -r 先清除上游可能新增
            # 或处于冲突态的 workflow 文件，再从 $BEFORE 完整恢复后一次性提交。
            git rm -q -f -r --ignore-unmatch .github/workflows
            git checkout "$BEFORE" -- .github/workflows
            git commit -m "merge upstream $UP_TAG"
          fi
          echo "MERGED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Decide tag / skip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          BASE=${UP_TAG#v}
          LAST_N=$(gh api "repos/${REPO}/releases?per_page=100" \
            --jq '.[].tag_name' 2>/dev/null \
            | grep -E "^v${BASE}\.[0-9]+$" | sort -V | tail -1 | sed 's/.*\.//' || true)
          LAST_N=${LAST_N:-0}
          NEW_N=$((LAST_N + 1))
          TAG="v${BASE}.${NEW_N}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [ "$LAST_N" -ge 1 ] && [ "$FORCE" != "true" ]; then
            PREV_BODY=$(gh api "repos/${REPO}/releases/tags/v${BASE}.${LAST_N}" --jq .body 2>/dev/null || true)
            if printf '%s' "$PREV_BODY" | grep -q "built-from: ${MERGED_SHA}"; then
              echo "::notice::无变化：${MERGED_SHA} 已作为 v${BASE}.${LAST_N} 发布，跳过构建"
              echo "SKIP=true" >> "$GITHUB_ENV"
            fi
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: 22

      - name: Build frontend
        if: env.SKIP != 'true'
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          # 上游 vue-tsc 有存量类型错误，直接 vite build（与本地构建一致）
          npx vite build

      - uses: actions/setup-go@v5
        if: env.SKIP != 'true'
        with:
          go-version-file: go.mod

      - name: Build linux-amd64
        if: env.SKIP != 'true'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X qingzhou/internal/version.Version=${TAG}" \
            -o qingzhou-linux-amd64 .
          # 探针：面板「升级探针」从本 release 同步（SyncHostedProbes），不构建则
          # 升级永远分发旧二进制——「升级成功但版本不变」的根因。版本号注入与
          # 面板同 TAG，否则探针上报 dev 导致面板永远提示待升级（be9cde1）。
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X qingzhou/internal/version.Version=${TAG}" \
              -o "probe-linux-$arch" ./cmd/probe
          done

      - name: Push merge
        if: env.SKIP != 'true'
        run: git push origin heiyu-custom

      - name: Create release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" \
            --target "$MERGED_SHA" \
            --title "$TAG" \
            --notes "基于上游 ${UP_TAG} + 自定义修复与品牌定制。

          built-from: ${MERGED_SHA}" \
            qingzhou-linux-amd64 probe-linux-amd64 probe-linux-arm64
